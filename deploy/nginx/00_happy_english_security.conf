# This file is loaded in nginx's http context before the Happy English servers.
server_tokens off;
limit_req_status 429;
limit_conn_status 429;

# Edge limits run before FastAPI consumes a database connection or model capacity.
limit_req_zone $binary_remote_addr zone=happy_auth_per_ip:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=happy_expensive_per_ip:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=happy_upload_per_ip:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=happy_analytics_per_ip:10m rate=60r/m;
limit_conn_zone $binary_remote_addr zone=happy_per_ip_connections:10m;

# The analytics content handler reads a bounded request body, then this log
# records it as one JSON Lines record.  `escape=json` keeps malformed input
# from corrupting subsequent records and deliberately excludes credentials.
log_format happy_analytics_json escape=json
    '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"status":$status,'
        '"request_length":$request_length,'
        '"content_length":"$content_length",'
        '"user_agent":"$http_user_agent",'
        '"body":"$request_body"'
    '}';

# nginx itself owns public analytics ingestion.  The handler only ensures the
# bounded body is read before the access log is evaluated; it never proxies
# events to the Python application.
perl_modules /etc/nginx/perl;
perl_require HappyEnglishAnalytics.pm;
