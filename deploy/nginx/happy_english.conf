# HTTP -> HTTPS redirect for the frontend and API host names.
server {
    listen 80;
    listen [::]:80;
    server_name happylingo.cn www.happylingo.cn api.happylingo.cn;
    if ($request_uri ~* "(^|/)\.(?!well-known(?:/|$))") { return 404; }
    return 301 https://$host$request_uri;
}

# Frontend and same-origin API proxy.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name happylingo.cn www.happylingo.cn;

    ssl_certificate     /etc/nginx/ssl/www.happylingo.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/www.happylingo.cn.key;
    ssl_session_cache   shared:SSL:1m;
    ssl_session_timeout 10m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    include /etc/nginx/snippets/happy_english_security_headers.conf;

    # Never serve hidden files such as .env; keep ACME challenge paths available.
    location ~* "(^|/)\.(?!well-known(?:/|$))" { return 404; }

    root /home/admin/happy_english_server/happy-english-ui/dist;
    index index.html;

    # Do not turn a disabled backend document endpoint into an SPA page.
    location = /docs { return 404; }
    location = /redoc { return 404; }
    location = /openapi.json { return 404; }

    location = /api/auth/login {
        limit_req zone=happy_auth_per_ip burst=5 nodelay;
        limit_conn happy_per_ip_connections 20;
        include /etc/nginx/snippets/happy_english_api_proxy.conf;
    }

    location = /api/auth/signup {
        limit_req zone=happy_auth_per_ip burst=5 nodelay;
        limit_conn happy_per_ip_connections 20;
        include /etc/nginx/snippets/happy_english_api_proxy.conf;
    }

    location = /api/auth/miniprogram/login {
        limit_req zone=happy_auth_per_ip burst=5 nodelay;
        limit_conn happy_per_ip_connections 20;
        include /etc/nginx/snippets/happy_english_api_proxy.conf;
    }

    location = /api/uploads {
        limit_req zone=happy_upload_per_ip burst=5 nodelay;
        limit_conn happy_per_ip_connections 20;
        include /etc/nginx/snippets/happy_english_api_proxy.conf;
    }

    location = /api/audio/tts {
        limit_req zone=happy_expensive_per_ip burst=2 nodelay;
        limit_conn happy_per_ip_connections 20;
        include /etc/nginx/snippets/happy_english_api_proxy.conf;
    }

    location = /api/audio/assessment {
        limit_req zone=happy_expensive_per_ip burst=2 nodelay;
        limit_conn happy_per_ip_connections 20;
        include /etc/nginx/snippets/happy_english_api_proxy.conf;
    }

    location ^~ /api/audio/menu-tts/ {
        limit_req zone=happy_expensive_per_ip burst=2 nodelay;
        limit_conn happy_per_ip_connections 20;
        include /etc/nginx/snippets/happy_english_api_proxy.conf;
    }

    include /etc/nginx/snippets/happy_english_analytics_ingest.conf;

    location /api/ {
        limit_conn happy_per_ip_connections 20;
        include /etc/nginx/snippets/happy_english_api_proxy.conf;
    }

    location /assets/ {
        include /etc/nginx/snippets/happy_english_security_headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /static/ {
        include /etc/nginx/snippets/happy_english_security_headers.conf;
        alias /home/admin/happy_english_server/happy-english/data/static/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location / {
        include /etc/nginx/snippets/happy_english_security_headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}

# API host. FastAPI disables its documentation in production; Nginx also
# denies these paths so the inventory cannot be exposed by a bad app setting.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.happylingo.cn;

    ssl_certificate     /etc/nginx/ssl/api.happylingo.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/api.happylingo.cn.key;
    ssl_session_cache   shared:SSL:1m;
    ssl_session_timeout 10m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    include /etc/nginx/snippets/happy_english_security_headers.conf;

    # Never proxy hidden files such as .env; keep ACME challenge paths available.
    location ~* "(^|/)\.(?!well-known(?:/|$))" { return 404; }

    location = /docs { return 404; }
    location = /redoc { return 404; }
    location = /openapi.json { return 404; }

    location = /api/auth/login {
        limit_req zone=happy_auth_per_ip burst=5 nodelay;
        limit_conn happy_per_ip_connections 20;
        include /etc/nginx/snippets/happy_english_api_proxy.conf;
    }

    location = /api/auth/signup {
        limit_req zone=happy_auth_per_ip burst=5 nodelay;
        limit_conn happy_per_ip_connections 20;
        include /etc/nginx/snippets/happy_english_api_proxy.conf;
    }

    location = /api/auth/miniprogram/login {
        limit_req zone=happy_auth_per_ip burst=5 nodelay;
        limit_conn happy_per_ip_connections 20;
        include /etc/nginx/snippets/happy_english_api_proxy.conf;
    }

    location = /api/uploads {
        limit_req zone=happy_upload_per_ip burst=5 nodelay;
        limit_conn happy_per_ip_connections 20;
        include /etc/nginx/snippets/happy_english_api_proxy.conf;
    }

    location = /api/audio/tts {
        limit_req zone=happy_expensive_per_ip burst=2 nodelay;
        limit_conn happy_per_ip_connections 20;
        include /etc/nginx/snippets/happy_english_api_proxy.conf;
    }

    location = /api/audio/assessment {
        limit_req zone=happy_expensive_per_ip burst=2 nodelay;
        limit_conn happy_per_ip_connections 20;
        include /etc/nginx/snippets/happy_english_api_proxy.conf;
    }

    location ^~ /api/audio/menu-tts/ {
        limit_req zone=happy_expensive_per_ip burst=2 nodelay;
        limit_conn happy_per_ip_connections 20;
        include /etc/nginx/snippets/happy_english_api_proxy.conf;
    }

    include /etc/nginx/snippets/happy_english_analytics_ingest.conf;

    location / {
        limit_conn happy_per_ip_connections 20;
        include /etc/nginx/snippets/happy_english_api_proxy.conf;
    }
}
