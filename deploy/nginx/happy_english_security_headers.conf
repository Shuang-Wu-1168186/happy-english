# Include inside HTTPS server and location blocks.
# The server's global configuration previously logged request bodies. Override it
# for every Happy English response so credentials and uploaded content do not
# reach the access log.
access_log /var/log/nginx/access.log json_combined;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self), payment=()" always;
add_header Content-Security-Policy "base-uri 'self'; frame-ancestors 'none'; object-src 'none'; form-action 'self'" always;
