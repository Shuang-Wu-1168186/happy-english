# Included by both public HTTPS virtual hosts before their generic API proxy.
# This exact match terminates analytics at Nginx and never reaches Uvicorn.
location = /api/analytics/events:batch {
    limit_req zone=happy_analytics_per_ip burst=30 nodelay;
    limit_conn happy_per_ip_connections 20;

    # The event contract caps batches at 100 entries.  Keep all accepted
    # bodies in memory so `$request_body` is available to the dedicated log.
    client_max_body_size 256k;
    client_body_buffer_size 256k;
    client_body_in_single_buffer on;
    client_body_timeout 15s;

    access_log /home/admin/logs/happy-english-analytics.log happy_analytics_json;
    add_header Cache-Control "no-store" always;
    add_header X-Analytics-Ingest "nginx" always;

    perl HappyEnglishAnalytics::handler;
}
