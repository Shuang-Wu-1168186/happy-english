# Shared FastAPI proxy settings. Include inside API location blocks.
include /etc/nginx/snippets/happy_english_security_headers.conf;
client_body_buffer_size 10m;
proxy_pass http://127.0.0.1:8000;
proxy_read_timeout 300s;
proxy_connect_timeout 300s;
proxy_send_timeout 300s;
client_body_timeout 300s;
send_timeout 300s;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;

# Security headers are emitted once by the Nginx server snippet. Keep the
# application copies for direct development access, but hide them here to
# avoid duplicate public response headers.
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header Content-Security-Policy;
